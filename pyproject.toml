[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-slm-serving-benchmark"
version = "0.1.0"
description = "Local SLM serving & cost benchmark: mlx_lm, Ollama, vllm-metal, hosted API (plus a deferred, estimated-only vLLM/CUDA cost comparison)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "structlog>=26.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Deliberately latest, not an older "LTS" pin — tried pinning back to 3.2.0
    # (the newest release before both CVE-2026-71211's gateway code and the
    # cryptography<X pin appear) and it backfires: 3.2.0 carries 30+ OTHER
    # known CVEs that 3.15.2 already fixed, plus an unpatched pyarrow pulled in
    # as a side effect. See docs/dependency-security-notes.md for the full
    # bisection. Latest is the safer choice; the one remaining CVE is
    # ignore-vuln'd in CI with reasoning there.
    "mlflow>=3.15.2",
    "groq>=1.7.0",
    "anthropic>=1.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # Capped below 2.0: >=3.x resolves an experimental httpx2/httpcore2
    # transport that throws a spurious `RuntimeError: generator didn't stop
    # after athrow()` on every streamed request's cleanup, from inside
    # httpcore2 itself — reproduced directly against forge.phase2.client on
    # this machine. Does not affect correctness (the result is already
    # returned before the traceback fires) but it's noise a benchmark
    # runner making thousands of streamed calls shouldn't spew. 1.109.1 uses
    # the long-stable plain httpx transport and shows no such error.
    "openai>=1.0.0,<2",

    "pymongo>=4.9.0",
    "numpy>=2.0.0",
    "psutil>=6.0.0",
    "uvicorn>=0.30.0",
    "matplotlib>=3.9.0",
    # Phase 4: uploading the GGUF to HF Hub (forge.phase4.upload_model).
    # Pinned to match the version actually installed and tested in
    # space/requirements.txt for the Gradio demo, which uses the same API.
    "huggingface_hub>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
